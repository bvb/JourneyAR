<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Journey AR — scene preview</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #1b1b1f;
        color: #ddd;
        font:
          14px system-ui,
          sans-serif;
      }
      #title {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .panes {
        display: flex;
        gap: 12px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 4px;
      }
      .pane {
        display: block;
        width: 800px;
        height: 600px;
      }
      #info {
        margin-top: 8px;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <div class="panes">
      <figure>
        <figcaption>Unity 6 (эталон)</figcaption>
        <img id="unity" class="pane" alt="Unity reference render" />
      </figure>
      <figure>
        <figcaption>three.js</figcaption>
        <canvas id="three" class="pane"></canvas>
      </figure>
    </div>
    <figure>
      <figcaption>Разница ×4 (фон не учитывается)</figcaption>
      <canvas id="diff" style="width: 400px; height: 300px"></canvas>
    </figure>
    <div id="info"></div>
    <script type="module" src="/src/dev/scene-preview.ts"></script>
  </body>
</html>
